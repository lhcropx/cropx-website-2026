<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CropX — Logo Strip Block</title>
  <style>
    @font-face { font-family:'Author'; src:local('Author-Regular'),local('Author Regular'); font-weight:400; }
    @font-face { font-family:'Author'; src:local('Author-Medium'),local('Author Medium'); font-weight:500; }
    @font-face { font-family:'Author'; src:local('Author-Semibold'),local('Author Semibold'); font-weight:600; }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { font-size:16px; }
    body { font-family:'Author','Aptos',Arial,sans-serif; background:#EDECEA; }

    :root {
      --deep-blue:  #243565;
      --cropx-blue: #0CA8C0;
      --white:      #ffffff;
      --gray-100:   #F2F1EF;
      --gray-200:   #E3E1DC;
      --gray-400:   #9B9893;
      --gray-500:   #6E6B66;
      --max-w:      72rem;

      /* Logo strip tokens */
      --logo-height:        38px;
      --logo-opacity:       0.85;
      --logo-opacity-hover: 1.0;
      --marquee-duration:   35s;
      --marquee-gap:        5rem;
      --marquee-fade-width: 6rem;
    }

    /* ─────────────────────────────────────────
       LOGO STRIP SECTION
    ───────────────────────────────────────── */
    .logo-strip {
      background: var(--white);
      padding: 3rem 0;
      border-top: 1px solid var(--gray-200);
      border-bottom: 1px solid var(--gray-200);
    }

    .logo-strip-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* Eyebrow */
    .logo-strip-eyebrow {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--deep-blue);
      margin-bottom: 2rem;
    }

    /* Marquee wrapper */
    .ls-marquee {
      position: relative;
      overflow: hidden;
    }

    /* Fade edges */
    .ls-marquee::before,
    .ls-marquee::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: var(--marquee-fade-width);
      z-index: 2;
      pointer-events: none;
    }
    .ls-marquee::before {
      left: 0;
      background: linear-gradient(to right, var(--white), transparent);
    }
    .ls-marquee::after {
      right: 0;
      background: linear-gradient(to left, var(--white), transparent);
    }

    /* Scrolling track */
    .ls-track {
      display: flex;
      align-items: center;
      gap: var(--marquee-gap);
      width: max-content;
      padding: 0.5rem 0;
      animation: logoScroll var(--marquee-duration) linear infinite;
    }

    /* Pause on hover */
    .ls-marquee:hover .ls-track {
      animation-play-state: paused;
    }

    @keyframes logoScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Logo images — full color treatment */
    .ls-logo {
      height: var(--logo-height);
      width: auto;
      display: block;
      flex-shrink: 0;
      opacity: var(--logo-opacity);
      transition: opacity 0.2s ease;
    }
    .ls-logo:hover {
      opacity: var(--logo-opacity-hover);
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      .ls-track { animation: none; }
    }
  </style>
</head>
<body>
